<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title description">
  <title id="title">Awake Aquarium</title>
  <desc id="description">Bright fish cross dark glass. Bubbles climb through neon tides. One crab guards the night.</desc>

  <defs>
    <linearGradient id="terminal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061724"/>
      <stop offset="0.55" stop-color="#07111f"/>
      <stop offset="1" stop-color="#100d25"/>
    </linearGradient>
    <radialGradient id="waterGlow" cx="50%" cy="35%" r="75%">
      <stop offset="0" stop-color="#0c3850" stop-opacity="0.72"/>
      <stop offset="0.6" stop-color="#071827" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#040914" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="floorGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#28d7e5" stop-opacity="0"/>
      <stop offset="1" stop-color="#28d7e5" stop-opacity="0.13"/>
    </linearGradient>
    <filter id="cyanGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="tankClip">
      <rect x="53" y="107" width="1094" height="447" rx="5"/>
    </clipPath>
  </defs>

  <style>
    .mono { font-family: SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace; }
    .fish { font-size: 29px; font-weight: 700; filter: url(#softGlow); }
    .bubble { fill: #78e7f2; font-size: 20px; filter: url(#cyanGlow); }
    .current { fill: #17647a; font-size: 18px; opacity: .46; }
    .plant { fill: #4ee29a; font-size: 22px; font-weight: 700; filter: url(#softGlow); }
    .sand { fill: #e3b65b; font-size: 18px; opacity: .86; }
    .fish-one { animation: swim-one 13s linear infinite; }
    .fish-two { animation: swim-two 17s linear infinite; }
    .fish-three { animation: swim-three 10s linear infinite; }
    .fish-four { animation: swim-four 20s linear infinite; }
    .b1 { animation: rise 6s ease-in infinite; animation-delay: -1s; }
    .b2 { animation: rise 8s ease-in infinite; animation-delay: -5s; }
    .b3 { animation: rise 7s ease-in infinite; animation-delay: -3s; }
    .b4 { animation: rise 9s ease-in infinite; animation-delay: -7s; }
    .b5 { animation: rise 6.5s ease-in infinite; animation-delay: -4s; }
    .weed-one { animation: sway 3.7s ease-in-out infinite alternate; transform-origin: 178px 510px; }
    .weed-two { animation: sway-back 4.3s ease-in-out infinite alternate; transform-origin: 992px 510px; }
    .crab { animation: crab-walk 12s ease-in-out infinite alternate; }
    .glint { animation: twinkle 2.8s ease-in-out infinite; }
    .status-dot { animation: pulse 1.8s ease-in-out infinite; }

    @keyframes swim-one {
      0% { transform: translateX(-110px); opacity: 0; }
      5% { opacity: 1; }
      94% { opacity: 1; }
      100% { transform: translateX(790px); opacity: 0; }
    }
    @keyframes swim-two {
      0% { transform: translateX(120px); opacity: 0; }
      6% { opacity: 1; }
      94% { opacity: 1; }
      100% { transform: translateX(-790px); opacity: 0; }
    }
    @keyframes swim-three {
      0% { transform: translateX(-280px); opacity: 0; }
      8% { opacity: 1; }
      92% { opacity: 1; }
      100% { transform: translateX(480px); opacity: 0; }
    }
    @keyframes swim-four {
      0% { transform: translateX(360px); opacity: 0; }
      6% { opacity: 1; }
      94% { opacity: 1; }
      100% { transform: translateX(-460px); opacity: 0; }
    }
    @keyframes rise {
      0% { transform: translateY(120px); opacity: 0; }
      15% { opacity: .95; }
      80% { opacity: .72; }
      100% { transform: translateY(-270px); opacity: 0; }
    }
    @keyframes sway { from { transform: rotate(-2deg); } to { transform: rotate(3deg); } }
    @keyframes sway-back { from { transform: rotate(3deg); } to { transform: rotate(-3deg); } }
    @keyframes crab-walk { from { transform: translateX(-85px); } to { transform: translateX(120px); } }
    @keyframes twinkle { 0%, 100% { opacity: .2; } 50% { opacity: 1; } }
    @keyframes pulse { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>

  <rect width="1200" height="620" rx="26" fill="#02050c"/>
  <rect x="12" y="12" width="1176" height="596" rx="20" fill="url(#terminal)" stroke="#24344b" stroke-width="2"/>
  <rect x="13" y="13" width="1174" height="78" rx="19" fill="#0b1220"/>
  <path d="M13 91H1187" stroke="#24344b" stroke-width="2"/>

  <circle cx="48" cy="51" r="8" fill="#ff5f57"/>
  <circle cx="76" cy="51" r="8" fill="#febc2e"/>
  <circle cx="104" cy="51" r="8" fill="#28c840"/>
  <text x="600" y="59" text-anchor="middle" class="mono" fill="#a8bdca" font-size="19" letter-spacing="5">AWAKE_AQUARIUM // BLUB BLUB</text>
  <circle cx="1033" cy="51" r="6" fill="#49e68b" class="status-dot" filter="url(#softGlow)"/>
  <text x="1050" y="57" class="mono" fill="#72eca5" font-size="16">BLUB BLUB BLUB</text>

  <g clip-path="url(#tankClip)">
    <rect x="53" y="107" width="1094" height="447" fill="url(#waterGlow)"/>
    <rect x="53" y="405" width="1094" height="149" fill="url(#floorGlow)"/>

    <text x="95" y="174" class="mono current">~  ~  ~</text>
    <text x="472" y="315" class="mono current">~  ~  ~  ~</text>
    <text x="847" y="230" class="mono current">~  ~</text>

    <g class="mono fish fish-one" fill="#ffd166">
      <text x="118" y="222">&gt;&lt;o&gt;</text>
      <text x="156" y="189" fill="#fff2bd" font-size="16" font-weight="500">(glub glub)</text>
    </g>
    <g class="mono fish fish-two" fill="#f28cff">
      <text x="900" y="290">&lt;o)))&gt;&lt;</text>
    </g>
    <g class="mono fish fish-three" fill="#62f5b3">
      <text x="390" y="376">&gt;&lt;&gt;</text>
    </g>
    <g class="mono fish fish-four" fill="#66d9ff">
      <text x="710" y="177">&lt;o))&gt;&lt;</text>
      <text x="724" y="144" fill="#d4f7ff" font-size="16" font-weight="500">(blub)</text>
    </g>

    <text x="183" y="405" class="mono bubble b1">o</text>
    <text x="310" y="330" class="mono bubble b2">.</text>
    <text x="560" y="390" class="mono bubble b3">O</text>
    <text x="824" y="358" class="mono bubble b4">o</text>
    <text x="1030" y="411" class="mono bubble b5">.</text>

    <g class="mono plant weed-one">
      <text x="166" y="492">Y</text>
      <text x="166" y="468">|</text>
      <text x="166" y="444">Y</text>
      <text x="166" y="420">|</text>
      <text x="166" y="396">/</text>
    </g>
    <g class="mono plant weed-two">
      <text x="980" y="492">Y</text>
      <text x="980" y="468">|</text>
      <text x="980" y="444">Y</text>
      <text x="980" y="420">|</text>
      <text x="980" y="396">\</text>
    </g>
    <g class="mono plant" opacity=".8">
      <text x="1060" y="492">Y</text>
      <text x="1060" y="468">|</text>
      <text x="1060" y="444">/</text>
    </g>

    <g class="mono crab" fill="#ff6b83" font-size="23" font-weight="700" filter="url(#softGlow)">
      <text x="493" y="490">v(o.o)v</text>
    </g>

    <g class="mono sand" filter="url(#softGlow)">
      <text x="795" y="470">/_\</text>
      <text x="795" y="493" fill="#ffcf5a">|$|</text>
      <text x="819" y="451" class="glint" fill="#fff3a1">*</text>
      <text x="65" y="514">.,_.__.__o.__.,_.__.__o.__.,_.__.__o.__.,_.__.__o.__.,_.__.__o.__.,_.__.__o.__.,_.__.__o.__.,_.__.__o.__.</text>
      <text x="65" y="538" opacity=".65">_______.________.________.________.________.________.________.________.________.________.________.________</text>
    </g>
  </g>

  <rect x="53" y="107" width="1094" height="447" rx="5" fill="none" stroke="#31cfdf" stroke-width="2" filter="url(#cyanGlow)"/>
  <rect x="410" y="98" width="380" height="25" rx="12" fill="#071522"/>
  <text x="600" y="117" text-anchor="middle" class="mono" fill="#e8fbff" font-size="18" font-weight="700" letter-spacing="2">[ BLUB 08:08:08 | BLOOP ]</text>

  <rect x="335" y="543" width="530" height="25" rx="12" fill="#07111f"/>
  <text x="600" y="561" text-anchor="middle" class="mono" fill="#7394a8" font-size="15" letter-spacing="1.4">[ f | b | space | t | p | ? | q ]</text>

  <text x="600" y="591" text-anchor="middle" class="mono" fill="#385469" font-size="13" letter-spacing="7">BLUB // BLOOP // GLUB</text>
</svg>
